name: issue-from-failure

on:
  workflow_run:
    workflows:
      - ci
      - codeql
      - semgrep
      - trivy
      - readiness-check
    types:
      - completed

jobs:
  open-or-update-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const workflowName = run.name;
            const branchName = run.head_branch || "unknown-branch";
            const signature = `[AUTO-FAILURE] ${workflowName} :: ${branchName}`;
            const body = [
              `Automated failure detected.`,
              ``,
              `- Workflow: ${workflowName}`,
              `- Branch: ${branchName}`,
              `- Conclusion: ${run.conclusion}`,
              `- Run URL: ${run.html_url}`,
              ``,
              `Review logs and convert into a specific remediation issue if needed.`
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = openIssues.find(issue => issue.title === signature);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: signature,
                body,
                labels: ["deos:type:qa", "deos:source:scanner", "deos:state:triage"]
              });
              core.info(`Created issue #${created.data.number}`);
            }