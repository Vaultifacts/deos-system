name: readiness-check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate launch readiness
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const hasLaunchBlocker = issues.some(issue =>
              !issue.pull_request &&
              issue.labels.some(l => l.name === "deos:type:launch-blocker")
            );

            const hasP0 = issues.some(issue =>
              !issue.pull_request &&
              issue.labels.some(l => l.name === "deos:priority:p0")
            );

            core.summary
              .addHeading("DEOS readiness summary")
              .addRaw(`Open launch blocker present: ${hasLaunchBlocker}\n`)
              .addRaw(`Open P0 present: ${hasP0}\n`)
              .write();

            if (hasLaunchBlocker || hasP0) {
              core.setFailed("Launch readiness gate failed: open launch blocker or P0 issue present.");
            }