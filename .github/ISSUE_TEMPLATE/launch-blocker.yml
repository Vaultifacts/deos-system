name: Launch Blocker
description: Explicit release-blocking issue
title: "[Launch Blocker] "
labels:
  - deos:type:launch-blocker
  - deos:priority:p0
  - deos:state:triage
body:
  - type: textarea
    id: blocker
    attributes:
      label: Blocker summary
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why this blocks launch
    validations:
      required: true

  - type: textarea
    id: unblock
    attributes:
      label: Required condition to unblock
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues or checks
    validations:
      required: true